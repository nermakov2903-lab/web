<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обратная связь</title>

<link rel="stylesheet"
href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>

<body>

<div class="container">

<h2 class="text-center">Форма обратной связи</h2>

<form>

<div class="form-group">
<label>Имя</label>
<input type="text" class="form-control" placeholder="Введите имя">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" class="form-control" placeholder="Введите email">
</div>

<div class="form-group">
<label>Тип услуги</label>
<select class="form-control">
<option>Аренда ПК</option>
<option>VIP зона</option>
<option>Турнир</option>
</select>
</div>

<div class="checkbox">
<label>
<input type="checkbox"> Согласен с правилами
</label>
</div>

<button type="submit" class="btn btn-success btn-block">
Отправить
</button>

</form>

</div>

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="js/bootstrap.min.js">

</body>
</html>
